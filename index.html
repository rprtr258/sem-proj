<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnum Opus — field autobattler (M1)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a10; color: #ddd;
  font-family: system-ui, sans-serif; }
#game { display: block; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); image-rendering: pixelated; background: #0e0d14; }
#ui { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
.screen { background: #16161f; border: 1px solid #333; border-radius: 10px;
  padding: 28px 36px; min-width: 420px; max-width: 780px; max-height: 92vh; overflow: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
h1 { font-size: 28px; letter-spacing: 2px; margin-bottom: 4px; }
.subtitle { color: #888; margin-bottom: 16px; }
button { background: #2a2a3a; color: #ddd; border: 1px solid #454; border-radius: 6px;
  padding: 8px 14px; cursor: pointer; font-size: 14px; }
button:hover { background: #3a3a50; }
button.big { font-size: 18px; padding: 12px 26px; margin-top: 14px; }
button.big.fight { background: #3a5a2a; }
button.mini { font-size: 12px; padding: 3px 8px; }
button.on { outline: 2px solid #7a7; }
.lang { margin-left: auto; }
.lang button { padding: 2px 8px; }
.dim { color: #888; }
.price { color: #e8c060; }
.hub { width: 94vw; max-width: none; height: 92vh; display: flex; flex-direction: column; }
.hub-top { display: flex; gap: 18px; align-items: center; margin-bottom: 12px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tab.on { outline: 2px solid #7a7; }
.tabbody { flex: 1; min-height: 0; overflow: auto; }
.shoprow { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
.card { border: 1px solid #3a3a4a; border-radius: 8px; padding: 10px; width: 150px;
  display: flex; flex-direction: column; gap: 6px; background: #1c1c28; }
.card.sold { opacity: 0.4; align-items: center; justify-content: center; }
.spellname { font-size: 15px; font-weight: 600; color: #cfc; }
.spellicon { width: 24px; height: 24px; flex: none; pointer-events: none; }
.reroll { align-self: center; }
.assembly { display: flex; gap: 18px; }
.wands { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.wand { border: 1px solid #3a3a4a; border-radius: 8px; padding: 8px; background: #1c1c28; }
.wand.active { outline: 2px solid #7a7; }
.wandhead { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.slots { display: flex; gap: 6px; }
.slot { width: 44px; height: 44px; border: 1px dashed #555; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; cursor: grab; background: #12121c; }
.invside { width: 240px; }
.invitems { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; min-height: 50px; }
.invitem { width: 40px; height: 40px; border: 1px solid #3a3a4a; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; cursor: grab; background: #12121c; }
.buildcode textarea { width: 100%; height: 44px; background: #0e0e16; color: #9f9;
  border: 1px solid #333; border-radius: 4px; font-size: 11px; font-family: monospace; }
.invlist { display: flex; flex-direction: column; gap: 6px; }
.invrow { display: flex; gap: 12px; align-items: center; border: 1px solid #2a2a3a;
  border-radius: 6px; padding: 6px 10px; background: #1a1a26; }
.stars { font-size: 34px; color: #ffd040; margin: 10px 0; }
.scores { margin-top: 18px; }
.scores-title { color: #aaa; margin-bottom: 4px; }
#tooltip { position: fixed; display: none; background: #101018; border: 1px solid #454;
  border-radius: 6px; padding: 8px 10px; font-size: 12px; max-width: 240px;
  pointer-events: none; z-index: 10; }
.ghost { position: fixed; font-size: 22px; color: #cfc; pointer-events: none; z-index: 20; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="tooltip"></div>
<script src="dist/main.js"></script>
</body>
</html>
